[package]
name = "pezzaliapp-zipunzip"
version = "1.0.0"
description = "PezzaliAPPZipUnzip — compressione ed estrazione archivi offline basata su 7-Zip"
authors = ["Alessandro Pezzali"]
license = "MIT"
repository = "https://github.com/pezzaliapp/PezzaliAPPZipUnzip"
edition = "2021"
rust-version = "1.77"

[lib]
name = "zipunzip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
walkdir = "2"
fs4 = { version = "0.13", features = ["sync"] }

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
