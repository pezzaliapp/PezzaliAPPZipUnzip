# Build e test su Windows x64 e Linux x64 con i runner standard di GitHub,
# gratuiti per i repository pubblici ("For public repositories, GitHub Actions
# minutes remain free"). Solo etichette standard: i runner "larger" sono sempre
# a pagamento e non vanno usati. Nessuna release, nessun segreto: i pacchetti
# restano artefatti temporanei del run (7 giorni). macOS e Linux arm64 sono
# verificati in locale (docs/TEST.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Dipendenze Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev xvfb file

      - run: npm ci
      - run: npm run fetch-7zip
      - run: npx tsc --noEmit
      - run: npm test

      - name: Test Rust (unità, IPC, integrazione con 7-Zip reale)
        working-directory: src-tauri
        run: cargo test -- --nocapture

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      # Linux: solo .deb. L'AppImage è escluso (vedi docs/MULTIPIATTAFORMA.md).
      - name: Pacchetti (Linux)
        if: runner.os == 'Linux'
        run: npm run tauri build -- --bundles deb

      - name: Pacchetti
        if: runner.os != 'Linux'
        run: npm run tauri build

      - name: Diagnostica motore (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a src-tauri/target/release/pezzaliapp-zipunzip --self-test

      - name: Diagnostica motore (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          src-tauri\target\release\pezzaliapp-zipunzip.exe --self-test > self-test.txt
          type self-test.txt
          findstr /C:"(incluso)" self-test.txt

      # L'installer NSIS è letto con il 7-Zip del progetto, senza eseguirlo:
      # deve contenere le licenze e un 7z.exe identico a quello ufficiale.
      - name: Contenuto dell'installer (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'nsis'
          & src-tauri/engine/7z.exe x -y "-o$out" $setup.FullName | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7-Zip non legge l'installer" }
          foreach ($f in 'LICENSE','THIRD_PARTY_NOTICES.md','engine/License.txt','engine/readme.txt','engine/7z.exe','engine/7z.dll') {
            $hit = Get-ChildItem -Recurse -File $out | Where-Object { $_.FullName.Replace('\','/').EndsWith("/$f") }
            if (-not $hit) { throw "manca $f nell'installer" }
            Write-Host "ok $f"
          }
          foreach ($f in '7z.exe','7z.dll','License.txt') {
            $a = (Get-FileHash "src-tauri/engine/$f").Hash
            $b = (Get-FileHash (Get-ChildItem -Recurse -File $out -Filter $f | Select-Object -First 1).FullName).Hash
            if ($a -ne $b) { throw "$f diverso dall'originale" }
            Write-Host "identico all'originale: $f $a"
          }

      # Il runner è una macchina usa e getta: installazione silenziosa per utente
      # e diagnostica dal percorso installato.
      - name: Installazione e diagnostica (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-ChildItem src-tauri/target/release/bundle/nsis/*.exe | Select-Object -First 1
          Start-Process $setup.FullName -ArgumentList '/S' -Wait
          $exe = Get-ChildItem -Recurse -File "$env:LOCALAPPDATA","$env:ProgramFiles" -Filter pezzaliapp-zipunzip.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $exe) { throw "app installata non trovata" }
          Write-Host "installata in $($exe.FullName)"
          $p = Start-Process $exe.FullName -ArgumentList '--self-test' -RedirectStandardOutput self-test-installed.txt -Wait -PassThru -NoNewWindow
          Get-Content self-test-installed.txt
          if ($p.ExitCode -ne 0 -or -not (Select-String -Quiet '(incluso)' self-test-installed.txt -SimpleMatch)) { throw "self-test fallito" }

      - uses: actions/upload-artifact@v4
        with:
          name: pacchetti-${{ matrix.os }}
          retention-days: 7
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
